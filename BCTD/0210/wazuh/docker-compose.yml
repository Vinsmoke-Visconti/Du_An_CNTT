
version: '3.8'

services:
  wazuh.manager:
    image: wazuh/wazuh-manager:4.7.2
    container_name: zt-wazuh01
    restart: always
    ports:
      - "1514:1514/udp"
      - "1515:1515"
      - "55000:55000"
    volumes:
      - wazuh_etc:/var/ossec/etc
      - wazuh_logs:/var/ossec/logs

  wazuh.dashboard:
    image: wazuh/wazuh-dashboard:4.7.2
    container_name: zt-wazuh-dashboard
    restart: always
    ports:
      - "443:5601"
    environment:
      - WAZUH_NUM_INDEXERS=1
      - INDEXER_URL=https://wazuh.indexer:9200
      - INDEXER_USERNAME=admin
      - INDEXER_PASSWORD=admin
    depends_on:
      - wazuh.manager

volumes:
  wazuh_etc:
  wazuh_logs: